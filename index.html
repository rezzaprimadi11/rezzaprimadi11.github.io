<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- ===== VIDEO SHOWCASE: STYLE ===== -->
    <style>
      #gami-showcase{
        --g-bg:#f5f2ea; --g-green:#2c7a6b; --g-coral:#e8745a; --g-mint:#aee5d3; --g-dark:#072c3a;
        --g-serif:Georgia,serif; --g-sans:system-ui,sans-serif; --g-mono:ui-monospace,Menlo,monospace;
        background:var(--g-bg); padding:clamp(56px,8vw,110px) 24px; position:relative; overflow:hidden;
      }
      #gami-showcase .gs-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,90px);align-items:center;}
      #gami-showcase .gs-eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--g-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6b7f80;margin-bottom:22px;}
      #gami-showcase .gs-eyebrow:before{content:"";width:28px;height:1px;background:var(--g-green);}
      #gami-showcase .gs-eyebrow b{color:var(--g-coral);font-weight:400;}
      #gami-showcase h2{font-family:var(--g-sans);font-weight:400;font-size:clamp(40px,6.4vw,76px);line-height:.98;letter-spacing:-.03em;color:var(--g-green);margin:0 0 18px;}
      #gami-showcase h2 em{display:block;font-family:var(--g-serif);font-style:italic;letter-spacing:-.01em;color:var(--g-coral);}
      #gami-showcase p.gs-desc{font-family:var(--g-sans);font-size:14px;line-height:1.7;color:#4d6366;max-width:380px;margin:0 0 28px;}
      #gami-showcase .gs-tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0;list-style:none;}
      #gami-showcase .gs-tags li{font-family:var(--g-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--g-green);border:1px solid rgba(44,122,107,.35);padding:7px 11px;}
      #gami-showcase .gs-cta{display:inline-flex;gap:10px;align-items:center;font-family:var(--g-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g-dark);text-decoration:none;border-bottom:1px solid var(--g-dark);padding-bottom:5px;}
      #gami-showcase .gs-media{position:relative;justify-self:center;width:min(100%,300px);}
      #gami-showcase .gs-media:before{content:"";position:absolute;inset:18px -18px -18px 18px;background:var(--g-mint);z-index:0;}
      #gami-showcase .gs-frame{position:relative;z-index:1;aspect-ratio:9/16;background:var(--g-dark);overflow:hidden;box-shadow:0 24px 60px rgba(7,44,58,.28);}
      #gami-showcase video{width:100%;height:100%;object-fit:cover;display:block;}
      #gami-showcase .gs-chip{position:absolute;z-index:2;left:-26px;bottom:34px;background:var(--g-mint);color:var(--g-dark);padding:12px 16px;font-family:var(--g-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;box-shadow:0 10px 24px rgba(7,44,58,.18);}
      #gami-showcase .gs-chip strong{display:block;font-family:var(--g-sans);font-size:15px;letter-spacing:-.01em;text-transform:none;font-weight:600;margin-top:3px;}
      #gami-showcase .gs-sound{position:absolute;z-index:3;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:rgba(7,44,58,.65);color:#fff;font-size:15px;backdrop-filter:blur(6px);}
      #gami-showcase .gs-badge{position:absolute;z-index:2;top:-22px;right:-22px;width:78px;height:78px;border-radius:50%;background:var(--g-coral);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--g-mono);font-size:8px;letter-spacing:.12em;line-height:1.5;text-transform:uppercase;animation:gsSpin 18s linear infinite;}
      #gami-showcase .gs-badge span{animation:gsSpin 18s linear infinite reverse;display:block}
      @keyframes gsSpin{to{transform:rotate(360deg)}}
      @media (max-width:760px){
        #gami-showcase .gs-wrap{grid-template-columns:1fr;}
        #gami-showcase .gs-media{order:2;width:min(80%,280px);margin-right:18px;}
        #gami-showcase .gs-chip{left:-12px;}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ===== VIDEO SHOWCASE: SCRIPT (disisipkan otomatis sebelum "Have a product in mind?") ===== -->
    <script>
    (function () {
      var HTML =
        '<div class="gs-wrap">' +
          '<div class="gs-text">' +
            '<div class="gs-eyebrow"><span><b>●</b> FIELD NOTES / NONI LEAVES</span></div>' +
            '<h2>Straight from the <em>source.</em></h2>' +
            '<p class="gs-desc">Premium dried noni leaves, packed and labelled for export. Thirty seconds on what you actually receive.</p>' +
            '<ul class="gs-tags"><li>Morinda citrifolia</li><li>Dried leaves</li><li>Raw botanical</li></ul>' +
            '<a class="gs-cta" href="#contact">Ask about noni leaves <span>↗</span></a>' +
          '</div>' +
          '<div class="gs-media">' +
            '<div class="gs-badge"><span>Export<br>ready</span></div>' +
            '<div class="gs-frame">' +
              '<video src="/videos/noni-leaves.mp4" poster="/assets/noni-leaves.jpeg" autoplay muted loop playsinline preload="metadata"></video>' +
              '<button class="gs-sound" type="button" aria-label="Toggle sound">🔇</button>' +
            '</div>' +
            '<div class="gs-chip">From West Kalimantan<strong>Dried noni leaves.</strong></div>' +
          '</div>' +
        '</div>';

      function css(el, prop) { return el ? getComputedStyle(el)[prop] : ''; }

      function matchTheme(sec) {
        try {
          var all = document.querySelectorAll('#root h1, #root h2');
          var h = null, i;
          for (i = 0; i < all.length; i++) { if (/marketplace/i.test(all[i].textContent)) { h = all[i]; break; } }
          if (h) {
            sec.style.setProperty('--g-sans', css(h, 'fontFamily'));
            sec.style.setProperty('--g-green', css(h, 'color'));
            var inner = h.querySelectorAll('*');
            for (i = 0; i < inner.length; i++) {
              if (css(inner[i], 'fontStyle') === 'italic') {
                sec.style.setProperty('--g-serif', css(inner[i], 'fontFamily'));
                sec.style.setProperty('--g-coral', css(inner[i], 'color'));
                break;
              }
            }
          }
          var small = document.querySelectorAll('#root span, #root p, #root div, #root a');
          for (i = 0; i < small.length; i++) {
            if (!small[i].children.length && /^\s*0\d\s*\/\s*\w+/.test(small[i].textContent)) {
              sec.style.setProperty('--g-mono', css(small[i], 'fontFamily'));
              break;
            }
          }
          var bg = css(document.querySelector('#root section'), 'backgroundColor');
        } catch (e) {}
      }

      function insert() {
        var hs = document.querySelectorAll('#root h1, #root h2');
        var target = null, i;
        for (i = 0; i < hs.length; i++) {
          if (/product\s+in\s+mind/i.test(hs[i].textContent)) { target = hs[i]; break; }
        }
        if (!target) return false;
        var n = target;
        while (n.parentElement && n.parentElement.id !== 'root' && n.parentElement.children.length < 4) n = n.parentElement;
        if (document.getElementById('gami-showcase')) return true;

        var sec = document.createElement('section');
        sec.id = 'gami-showcase';
        sec.innerHTML = HTML;
        n.parentElement.insertBefore(sec, n);
        matchTheme(sec);

        var v = sec.querySelector('video'), b = sec.querySelector('.gs-sound');
        b.addEventListener('click', function () {
          v.muted = !v.muted; b.textContent = v.muted ? '🔇' : '🔊';
          if (!v.muted) v.play();
        });
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (e) {
            e[0].isIntersecting ? v.play().catch(function(){}) : v.pause();
          }, { threshold: 0.35 }).observe(v);
        }
        return true;
      }

      var tries = 0;
      var t = setInterval(function () {
        if (insert() || ++tries > 60) clearInterval(t);
      }, 250);
    })();
    </script>
  </body>
</html>
